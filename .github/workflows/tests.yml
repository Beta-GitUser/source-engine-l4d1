name: Tests

# Engine unit tests (they need a full build first, so they are expensive on a
# private repository). Automatic runs are opt-in:
#
#   * workflow_dispatch  - run manually from the Actions tab
#   * push / pull_request - only when the repository variable L4D1_CI_ON_PUSH
#                          is `true` (Settings -> Secrets and variables ->
#                          Actions -> Variables). Unset = skipped, no minutes.
#
# The cheap, engine-free launcher checks live in tooling.yml and run there.

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-linux-i386:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-i386
      run: |
        scripts/tests-ubuntu-i386.sh

  tests-linux-amd64:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: ubuntu-20.04

    steps:
    - uses: actions/checkout@v2
    - name: Run tests linux-amd64
      run: |
        scripts/tests-ubuntu-amd64.sh

  tests-macos-amd64:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v2
    - name: Run tests macos-amd64
      run: |
        scripts/tests-macos-amd64.sh

  tests-windows-i386:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-i386
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/ --32bits
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe

  tests-windows-amd64:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: windows-2019

    steps:
    - uses: actions/checkout@v2
    - name: Run tests windows-amd64
      run: |
        git submodule init && git submodule update
        ./waf.bat configure -T release --tests --prefix=out/
        ./waf.bat install
        cd out
        $env:Path = "bin";
        ./unittest.exe
