name: Android build

# The build machine you probably do not have.
#
# Google ships the Android NDK for x86_64 hosts only, so an arm64 phone cannot
# compile this engine, and a machine without a working Linux install cannot
# either. GitHub's runners are x86_64 Linux with an Android toolchain, which
# makes them the cheapest available way to produce an arm64 build. See
# docs/L4D1/BUILDING.md.
#
# Gating follows the rest of the repository:
#
#   * workflow_dispatch  - run manually (Actions tab, or
#                          `gh workflow run "Android build" --ref <branch>`)
#   * push               - only when the repository variable L4D1_CI_ON_PUSH is
#                          `true`; unset means no runner minutes are spent
#
# A full engine build takes a while. Narrow it down with the `games` input
# (for example `hl2`) while iterating on toolchain problems: only the game code
# changes then, not the whole engine's worth of objects.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        type: choice
        options: [aarch64, armeabi-v7a]
        default: aarch64
      ndk_version:
        description: "NDK revision (xcompile.py understands r10e, r19c and r20)"
        type: string
        default: r10e
      games:
        description: "Game code to build (left4dead, hl2, ...)"
        type: string
        default: left4dead
      api:
        description: "Android API level"
        type: string
        default: "21"
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      NDK_VERSION: ${{ inputs.ndk_version || 'r10e' }}
      GAMES: ${{ inputs.games || 'left4dead' }}
      API: ${{ inputs.api || '21' }}
      # The image exports ANDROID_NDK_HOME pointing at a modern NDK, which
      # xcompile.py rejects ("Unknown NDK revision: 27"). Empty wins over the
      # inherited value, so the script fetches NDK_VERSION instead.
      NDK_HOME: ""
      ANDROID_NDK_HOME: ""

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Host toolchain
      run: |
        gcc --version | head -1
        python3 --version
        unzip -v | head -2
        df -h "$GITHUB_WORKSPACE" | tail -1
        if [ -d thirdparty ] && [ -z "$(ls -A thirdparty)" ]; then
          echo "::warning::thirdparty/ is empty - submodules did not populate"
        fi

    - name: Cache NDK
      uses: actions/cache@v4
      with:
        path: .ndk
        key: ndk-${{ env.NDK_VERSION }}-linux-x86_64

    - name: Configure and build
      shell: bash
      run: |
        set -o pipefail
        sh scripts/build-android.sh 2>&1 | tee build-android.log

    # Artifacts are the full story, but they are a download away and the log
    # URL redirects to storage that a restricted network may not reach. Turn the
    # failure into annotations, which travel with the run itself.
    - name: Diagnose failure
      if: failure()
      shell: bash
      run: |
        annotate() {
          while IFS= read -r line; do
            line="${line//$'\r'/}"
            [ -z "$line" ] && continue
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done
        }
        # waf prints the failing command as a Python list, so a plain tail is
        # 40 lines of flags with the actual diagnostic somewhere above it.
        if [ -f build-android.log ]; then
          grep -aE 'error:|fatal error|undefined reference|Error [0-9]+|No such file|cannot find|Unknown NDK' \
            build-android.log \
            | grep -av 'sysroot=' \
            | grep -av "^\['" \
            | tail -n 12 > /tmp/errors.txt || true
          [ -s /tmp/errors.txt ] || tail -n 12 build-android.log > /tmp/errors.txt
          echo "--- from build-android.log ---"
          annotate < /tmp/errors.txt
        fi
        if [ -f build/config.log ]; then
          echo "--- from build/config.log ---"
          grep -aE 'error|fatal|not found|unknown|unsupported' build/config.log \
            | tail -n 6 | annotate || true
        fi

    - name: Collect libraries
      if: always()
      run: |
        mkdir -p out
        for name in libclient.so libserver.so liblauncher.so libgameui.so; do
          src=$(find . -name "$name" -type f -not -path "./out/*" | head -n1 || true)
          if [ -n "$src" ]; then
            cp "$src" "out/$name"
            echo "collected $name from $src"
          else
            echo "::warning::no $name in the build tree"
          fi
        done
        ls -l out || true

    - name: Verify the modules are really ${{ env.ARCH }}
      if: always()
      shell: bash
      run: |
        case "$ARCH" in
          aarch64) expect="AArch64" ;;
          armeabi-v7a*) expect="ARM" ;;
          x86_64) expect="x86-64" ;;
          *) expect="x86" ;;
        esac
        status=0
        for name in libclient.so libserver.so; do
          file="out/$name"
          if [ ! -f "$file" ]; then
            echo "::error::missing $name - the game code did not build"
            status=1
            continue
          fi
          python3 -m l4d1ctl inspect "$file"
          if ! python3 -m l4d1ctl inspect "$file" | grep -q "$expect"; then
            echo "::error::$name is not $expect - the cross-compile picked up the host toolchain"
            status=1
          fi
        done
        exit $status

    - name: Restore the debug keystore
      if: always()
      uses: actions/cache@v4
      with:
        path: .keys
        key: android-debug-keystore-v1

    - name: Keep the debug key stable between runs
      if: always()
      run: |
        # A fresh key per run means the next APK refuses to install over the
        # previous one (INSTALL_FAILED_UPDATE_INCOMPATIBLE) unless it is
        # uninstalled first - painful on a device with no cable. So the key is
        # generated once and cached, not regenerated.
        #
        # Cached rather than committed: it is still only a debug key, but a
        # private key in git is a habit worth not having. Losing the cache costs
        # one uninstall, nothing more.
        set +e
        mkdir -p .keys
        if [ ! -f .keys/debug.keystore ]; then
          keytool -genkeypair -keystore .keys/debug.keystore -storetype JKS \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
        fi
        if [ -f .keys/debug.keystore ]; then
          echo "L4D1_DEBUG_KEYSTORE=$PWD/.keys/debug.keystore" >> "$GITHUB_ENV"
        else
          echo "::warning::no stable keystore; build-apk.sh will make a throwaway one"
        fi

    - name: Build the debug APK
      id: apk
      if: always()
      run: |
        set -o pipefail
        # The APK is the delivery vehicle, not a nicety: an unrooted phone cannot
        # run a bare .so, because the linker only maps libraries into a process
        # it creates. See scripts/build-apk.sh.
        (
        mkdir -p apk-libs
        # Engine modules: everything the build produced, minus the NDK's own.
        find . -name '*.so' -not -path './.ndk/*' -not -path './out/*' \
             -not -path './lib/android/*' -not -path './thirdparty/*' \
             -exec cp {} apk-libs/ \; 2>/dev/null || true
        # Prebuilt third-party libraries (SDL2, steam_api, ...) from the submodule.
        if [ -d "lib/android/$ARCH" ]; then
          cp lib/android/$ARCH/*.so apk-libs/ 2>/dev/null || true
        fi
        ls -1 apk-libs | wc -l | xargs echo "native libraries to package:"
        # Two invocations rather than a clever expansion: quoting inside
        # ${var:+...} does not survive the way it reads.
        if [ -n "$L4D1_DEBUG_KEYSTORE" ]; then
          sh scripts/build-apk.sh --libs apk-libs --out apk-out/l4d1-debug.apk \
            --arch "$ARCH" --api "$API" --keystore "$L4D1_DEBUG_KEYSTORE"
        else
          sh scripts/build-apk.sh --libs apk-libs --out apk-out/l4d1-debug.apk \
            --arch "$ARCH" --api "$API"
        fi
        ) 2>&1 | tee apk-build.log

    - name: Explain an APK failure
      if: always() && steps.apk.outcome == 'failure'
      continue-on-error: true
      run: |
        # The previous attempt here died with "Process completed with exit code 2"
        # and nothing else, because job logs are awkward to retrieve. Annotations
        # are not, so put the tail of the log where it will actually be read.
        echo "The packaging step failed. Last 25 lines of apk-build.log:"
        tail -n 25 apk-build.log 2>/dev/null | while IFS= read -r line; do
          line=${line//'%'/'%25'}
          line=${line//$'\r'/}
          echo "::error title=APK build::${line}"
        done

    - name: Upload the APK build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-apk-log
        path: apk-build.log
        if-no-files-found: warn
        retention-days: 14"

    - name: Upload the debug APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-debug-apk
        path: apk-out/l4d1-debug.apk
        if-no-files-found: warn
        retention-days: 30

    - name: Upload libraries
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-libraries
        path: out/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-logs
        path: |
          build-android.log
          build/config.log
        if-no-files-found: warn
        retention-days: 14

    - name: Summary
      if: always()
      run: |
        {
          echo "### Android build: $ARCH, NDK $NDK_VERSION, games=$GAMES"
          echo
          if [ -d out ] && [ -n "$(ls -A out 2>/dev/null)" ]; then
            echo "| file | size |"
            echo "| --- | --- |"
            for f in out/*; do
              echo "| $(basename "$f") | $(wc -c <"$f" | tr -d ' ') bytes |"
            done
          else
            echo "No libraries were produced - read the **logs** artifact."
          fi
          echo
          if [ -f apk-out/l4d1-debug.apk ]; then
            echo "**Debug APK**: \`apk-out/l4d1-debug.apk\` ($(wc -c <apk-out/l4d1-debug.apk | tr -d ' ') bytes)."
            echo
            echo "Copy it to the phone, open it, and launch **L4D1 debug**: it loads every"
            echo "module it finds and reports how far it gets, on screen and in"
            echo "\`files/probe.log\`."
            echo
          fi
          echo "Install on a device with:"
          echo '```sh'
          echo "python3 -m l4d1ctl module install --from <unzipped artifact> --force"
          echo "L4D1_TARGET_MACHINE=$ARCH python3 -m l4d1ctl check --engine <engine>"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
