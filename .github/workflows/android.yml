name: Android build

# The build machine you probably do not have.
#
# Google ships the Android NDK for x86_64 hosts only, so an arm64 phone cannot
# compile this engine, and a machine without a working Linux install cannot
# either. GitHub's runners are x86_64 Linux with an Android toolchain, which
# makes them the cheapest available way to produce an arm64 build. See
# docs/L4D1/BUILDING.md.
#
# Gating follows the rest of the repository:
#
#   * workflow_dispatch  - run manually (Actions tab, or
#                          `gh workflow run "Android build" --ref <branch>`)
#   * push               - only when the repository variable L4D1_CI_ON_PUSH is
#                          `true`; unset means no runner minutes are spent
#
# A full engine build takes a while. Narrow it down with the `games` input
# (for example `hl2`) while iterating on toolchain problems: only the game code
# changes then, not the whole engine's worth of objects.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target architecture"
        type: choice
        options: [aarch64, armeabi-v7a]
        default: aarch64
      ndk_version:
        description: "NDK revision (xcompile.py understands r10e, r19c and r20)"
        type: string
        default: r10e
      games:
        description: "Game code to build (left4dead, hl2, ...)"
        type: string
        default: left4dead
      api:
        description: "Android API level"
        type: string
        default: "21"
  push:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  # The event name is part of the group on purpose. Without it, every push to the
  # branch creates a run in the same group - and even though a push-triggered run
  # skips at the job level (L4D1_CI_ON_PUSH), the *workflow run* still enters the
  # group and cancels the build that is already going. That is how a green build
  # gets killed two minutes after it was dispatched, with "Canceling since a
  # higher priority waiting request exists" and no artifact.
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.event_name == 'workflow_dispatch' || vars.L4D1_CI_ON_PUSH == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: ${{ inputs.arch || 'aarch64' }}
      NDK_VERSION: ${{ inputs.ndk_version || 'r10e' }}
      GAMES: ${{ inputs.games || 'left4dead' }}
      API: ${{ inputs.api || '21' }}
      # The image exports ANDROID_NDK_HOME pointing at a modern NDK, which
      # xcompile.py rejects ("Unknown NDK revision: 27"). Empty wins over the
      # inherited value, so the script fetches NDK_VERSION instead.
      NDK_HOME: ""
      ANDROID_NDK_HOME: ""
      # The Bink decoder video_bink links against. Building it is ~6 minutes, so
      # the whole .ffmpeg tree is cached keyed by version; the script's own stamp
      # makes a cache hit a no-op. FFMPEG=0 builds without the video module.
      FFMPEG_VERSION: n4.4.4

    steps:
    - name: Checkout (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Host toolchain
      run: |
        gcc --version | head -1
        python3 --version
        unzip -v | head -2
        df -h "$GITHUB_WORKSPACE" | tail -1
        if [ -d thirdparty ] && [ -z "$(ls -A thirdparty)" ]; then
          echo "::warning::thirdparty/ is empty - submodules did not populate"
        fi

    - name: Cache NDK
      uses: actions/cache@v4
      with:
        path: .ndk
        key: ndk-${{ env.NDK_VERSION }}-linux-x86_64

    - name: Cache FFmpeg
      uses: actions/cache@v4
      with:
        path: .ffmpeg
        key: ffmpeg-${{ env.FFMPEG_VERSION }}-${{ env.ARCH }}-${{ env.API }}

    - name: Configure and build
      id: build
      shell: bash
      run: |
        set -o pipefail
        sh scripts/build-android.sh 2>&1 | tee build-android.log

    # Artifacts are the full story, but they are a download away and the log
    # URL redirects to storage that a restricted network may not reach. Turn the
    # failure into annotations, which travel with the run itself.
    - name: Diagnose failure
      if: failure()
      shell: bash
      run: |
        annotate() {
          while IFS= read -r line; do
            line="${line//$'\r'/}"
            [ -z "$line" ] && continue
            line="${line:0:900}"
            line="${line//'%'/'%25'}"
            echo "::error::${line}"
          done
        }
        # waf prints the failing command as a Python list, so a plain tail is
        # 40 lines of flags with the actual diagnostic somewhere above it.
        if [ -f build-android.log ]; then
          grep -aE 'error:|fatal error|undefined reference|Error [0-9]+|No such file|cannot find|Unknown NDK' \
            build-android.log \
            | grep -av 'sysroot=' \
            | grep -av "^\['" \
            | tail -n 12 > /tmp/errors.txt || true
          [ -s /tmp/errors.txt ] || tail -n 12 build-android.log > /tmp/errors.txt
          echo "--- from build-android.log ---"
          annotate < /tmp/errors.txt
        fi
        if [ -f build/config.log ]; then
          echo "--- from build/config.log ---"
          grep -aE 'error|fatal|not found|unknown|unsupported' build/config.log \
            | tail -n 6 | annotate || true
        fi

    - name: Collect libraries
      if: always()
      run: |
        mkdir -p out
        # ::notice:: rather than a plain echo: annotations survive in the API even
        # when the job log does not come back (it returns EOF from some networks),
        # and "which modules were collected" is the one fact this step exists to
        # establish.
        found=$(find . -name '*.so' -not -path './.ndk/*' -not -path './out/*' -not -path './thirdparty/*' -not -path './lib/android/*' -type f | sed 's|.*/||' | sort -u | tr '\n' ' ')
        echo "::notice title=shared objects in the build tree::$(echo "$found" | wc -w) files: $found"
        for name in libclient.so libserver.so liblauncher.so; do
          src=$(find . -name "$name" -type f -not -path "./out/*" | head -n1 || true)
          if [ -n "$src" ]; then
            cp "$src" "out/$name"
            echo "::notice title=collected::$name from $src"
          else
            echo "::warning::no $name in the build tree"
          fi
        done

        # GameUI is a case-sensitive name, and this is where it was reported as a
        # gap for several runs: gameui/wscript sets target 'GameUI', so waf writes
        # libGameUI.so, and the engine's Android loader in tier1/interface.cpp
        # (foundLibraryWithPrefix) looks for exactly "lib" + name + ".so" inside
        # APP_LIB_PATH. The old list asked for libgameui.so, found nothing, and
        # warned about a module that was there all along.
        gameui=$(find . -iname 'libgameui.so' -type f -not -path "./out/*" | head -n1 || true)
        if [ -n "$gameui" ]; then
          cp "$gameui" "out/$(basename "$gameui")"
          echo "::notice title=collected::$(basename "$gameui") from $gameui"
        else
          echo "::warning::no libGameUI.so in the build tree - the base UI module is missing"
        fi
        # Everything else the build produced. The four named modules are what the
        # engine looks up by name, but each of them carries DT_NEEDED edges -
        # libclient -> tier0, materialsystem, studiorender, datacache - so an
        # artifact with only the four fails at dlopen with the name of a missing
        # dependency, on the device, where nobody can read a log.
        extra=0
        while IFS= read -r so; do
          base=$(basename "$so")
          if [ ! -f "out/$base" ]; then
            cp "$so" "out/$base"
            extra=$((extra + 1))
          fi
        done < <(find build -name '*.so' -type f | sort)
        # Prebuilt third-party libraries are not produced by waf, so they are not
        # in build/. libSDL2.so lives in the submodule's lib/android/<arch>/ and
        # every module that touches SDL names it in DT_NEEDED. Leaving it out of
        # the artifact moves the failure to the device, where it reads as
        # "dlopen failed: library libSDL2.so not found" and nothing else.
        prebuilt=0
        if [ -d "lib/android/$ARCH" ]; then
          for so in lib/android/$ARCH/*.so; do
            [ -f "$so" ] || continue
            cp "$so" "out/$(basename "$so")"
            echo "::notice title=collected prebuilt::$(basename "$so") from $so"
            prebuilt=$((prebuilt + 1))
          done
        fi
        [ "$prebuilt" -gt 0 ] || echo "::warning::no prebuilt .so under lib/android/$ARCH - SDL2 will be missing from the artifact"

        echo "::notice title=collected total::$(ls -1 out/*.so 2>/dev/null | wc -l) modules in the artifact ($extra from build/, $prebuilt prebuilt); names: $(ls -1 out/*.so 2>/dev/null | xargs -n1 basename | sort | tr '\n' ' ')"
        ls -l out || true

    - name: Verify the modules are really ${{ env.ARCH }}
      if: always()
      shell: bash
      run: |
        case "$ARCH" in
          aarch64) expect="AArch64" ;;
          armeabi-v7a*) expect="ARM" ;;
          x86_64) expect="x86-64" ;;
          *) expect="x86" ;;
        esac
        status=0
        for name in libclient.so libserver.so; do
          file="out/$name"
          if [ ! -f "$file" ]; then
            echo "::error::missing $name - the game code did not build"
            status=1
            continue
          fi
          python3 -m l4d1ctl inspect "$file"
          if ! python3 -m l4d1ctl inspect "$file" | grep -q "$expect"; then
            echo "::error::$name is not $expect - the cross-compile picked up the host toolchain"
            status=1
          fi
        done
        exit $status

    # Only a build that finished produces the artifact. The collect step still runs
    # on a cancelled or failed build - its ::notice:: lines are how "which modules
    # were missing" is read back through the API - but uploading that run's handful
    # of files under the same name as a real artifact is how somebody ends up
    # installing a stub and reporting it as a broken build.
    - name: Upload libraries
      if: steps.build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-libraries
        path: out/
        if-no-files-found: warn
        retention-days: 30

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: android-${{ env.ARCH }}-logs
        path: |
          build-android.log
          build/config.log
        if-no-files-found: warn
        retention-days: 14

    - name: Summary
      if: always()
      run: |
        {
          echo "### Android build: $ARCH, NDK $NDK_VERSION, games=$GAMES"
          echo
          if [ -d out ] && [ -n "$(ls -A out 2>/dev/null)" ]; then
            echo "| file | size |"
            echo "| --- | --- |"
            for f in out/*; do
              echo "| $(basename "$f") | $(wc -c <"$f" | tr -d ' ') bytes |"
            done
          else
            echo "No libraries were produced - read the **logs** artifact."
          fi
          echo
          echo "Install on a device with:"
          echo '```sh'
          echo "python3 -m l4d1ctl module install --from <unzipped artifact> --force"
          echo "L4D1_TARGET_MACHINE=$ARCH python3 -m l4d1ctl check --engine <engine>"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
